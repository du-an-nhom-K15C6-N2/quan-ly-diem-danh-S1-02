<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lại Mật Khẩu - Hệ Thống Điểm Danh</title>
    <style>
        :root {
            --bg-start: #f0f7ff;
            --bg-end: #dfe9ff;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --card-bg: rgba(255, 255, 255, 0.87);
            --text: #0f172a;
            --muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            padding: 16px;
        }

        .card {
            background: var(--card-bg);
            padding: 32px 28px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 16px 36px rgba(15, 23, 42, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        h2 { color: var(--text); text-align: center; margin-bottom: 20px; font-size: 24px; }

        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; margin-bottom: 6px; color: var(--text); font-size: 13px; font-weight: 700; }
        .input-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid rgba(148, 163, 184, 0.35);
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        button:hover { transform: translateY(-1px); filter: brightness(1.03); }

        .message { margin-top: 15px; text-align: center; font-size: 14px; }
        .message.error { color: #b91c1c; }
        .message.success { color: #047857; }

        @media (max-width: 480px) {
            .card {
                padding: 24px 18px;
                border-radius: 16px;
            }
            h2 { font-size: 22px; }
        }

        @media (max-width: 360px) {
            body { padding: 12px; }
            .card { padding: 20px 14px; }
            h2 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Đặt Lại Mật Khẩu</h2>
        <form id="resetForm">
            <div class="input-group">
                <label for="newPassword">Mật khẩu mới:</label>
                <input type="password" id="newPassword" required placeholder="Ít nhất 8 ký tự">
            </div>
            <div class="input-group">
                <label for="confirmPassword">Xác nhận mật khẩu mới:</label>
                <input type="password" id="confirmPassword" required placeholder="Nhập lại mật khẩu mới">
            </div>
            <button type="submit">Xác nhận đổi mật khẩu</button>
        </form>
        <div id="message" class="message" role="status"></div>
    </div>
</body>
<script>
    const resetForm = document.getElementById('resetForm');
    const message = document.getElementById('message');
    const token = new URLSearchParams(window.location.search).get('token');
    const apiBaseUrl = window.location.protocol === 'file:'
        ? 'http://localhost:3000'
        : window.location.origin;

    if (!token) {
        resetForm.style.display = 'none';
        message.textContent = 'Liên kết đặt lại mật khẩu không hợp lệ.';
        message.className = 'message error';
    }

    resetForm.addEventListener('submit', async function(event) {
        event.preventDefault();
        const password = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password.length < 8) {
            message.textContent = 'Mật khẩu phải có ít nhất 8 ký tự.';
            message.className = 'message error';
            return;
        }
        if (password !== confirmPassword) {
            message.textContent = 'Mật khẩu xác nhận không khớp.';
            message.className = 'message error';
            return;
        }

        try {
            const response = await fetch(`${apiBaseUrl}/api/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, password })
            });
            const result = await response.json();
            message.textContent = result.message;
            message.className = result.success ? 'message success' : 'message error';
            if (result.success) {
                resetForm.reset();
                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
            }
        } catch (error) {
            if (window.location.protocol === 'file:') {
                message.textContent = 'Bạn đang mở file trực tiếp. Hãy chạy "npm start" rồi mở http://localhost:3000/reset-password.html';
            } else {
                message.textContent = 'Không thể kết nối đến máy chủ.';
            }
            message.className = 'message error';
        }
    });
</script>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Hệ Thống Điểm Danh</title>
    <style>
        :root {
            --bg-start: #f0f7ff;
            --bg-end: #dfe9ff;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-soft: #e0ecff;
            --card-bg: rgba(255, 255, 255, 0.82);
            --text: #0f172a;
            --muted: #64748b;
            --border: rgba(148, 163, 184, 0.35);
            --danger-bg: #fee2e2;
            --danger-text: #991b1b;
            --success: #10b981;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            position: relative;
            overflow-x: hidden;
            padding: 16px;
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: rgba(37, 99, 235, 0.08);
            filter: blur(12px);
        }

        body::before {
            top: -120px;
            left: -80px;
        }

        body::after {
            right: -60px;
            bottom: -140px;
        }

        .login-card {
            position: relative;
            z-index: 1;
            width: min(92vw, 420px);
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
            border-radius: 24px;
            padding: 36px 30px 28px;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .brand-mark {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--primary) 0%, #60a5fa 100%);
            color: white;
            font-size: 24px;
            box-shadow: 0 12px 25px rgba(37, 99, 235, 0.28);
        }

        h2 {
            margin: 0;
            color: var(--text);
            font-size: 28px;
            letter-spacing: -0.03em;
            text-align: center;
        }

        .desc {
            margin: 8px 0 22px;
            font-size: 13px;
            color: var(--muted);
            text-align: center;
            letter-spacing: 0.02em;
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-bottom: 20px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(16, 185, 129, 0.08);
            color: #0f766e;
            font-size: 12px;
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 0 5px rgba(16, 185, 129, 0.15);
        }

        .alert-timeout {
            background: var(--danger-bg);
            color: var(--danger-text);
            padding: 11px 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 18px;
            text-align: center;
            display: none;
            border: 1px solid rgba(153, 27, 27, 0.08);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 8px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap input {
            width: 100%;
            padding: 13px 14px 13px 42px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            color: var(--text);
            background: rgba(255, 255, 255, 0.8);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        .input-wrap input:focus {
            border-color: rgba(37, 99, 235, 0.8);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
            transform: translateY(-1px);
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 16px;
        }

        .row-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0 22px;
            font-size: 12px;
        }

        .remember {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
        }

        .remember input {
            accent-color: var(--primary);
        }

        .forgot-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.24);
        }

        .btn-login:hover {
            transform: translateY(-1px);
            filter: brightness(1.03);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .footer-note {
            margin-top: 18px;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
        }

        .demo-role-selector {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px dashed var(--border);
            text-align: center;
        }

        .demo-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .demo-buttons {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-role-tag {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: #334155;
            font-size: 12px;
            font-weight: 600;
            padding: 11px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-role-tag:hover {
            background: var(--primary-soft);
            border-color: var(--primary);
            color: var(--primary);
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 24px 18px 20px;
                border-radius: 20px;
            }

            h2 {
                font-size: 22px;
            }

            .row-actions {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .demo-buttons {
                flex-direction: column;
            }

            .btn-role-tag {
                width: 100%;
                text-align: center;
            }
        }

        @media (max-width: 360px) {
            .login-card {
                padding: 20px 14px 16px;
                border-radius: 16px;
            }

            h2 {
                font-size: 20px;
            }

            .demo-label {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand">
        <div class="brand-mark"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
        <h2>Cổng Điểm Danh</h2>
    </div>
    <div class="desc">Đăng nhập an toàn</div>
    <div class="status-chip"><span class="status-dot"></span> Hệ thống đang hoạt động</div>

    <div id="timeoutAlert" class="alert-timeout"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg> Phiên làm việc đã hết hạn. Vui lòng đăng nhập lại!</div>

    <div class="form-group">
        <label>Tài khoản / Mã sinh viên</label>
        <div class="input-wrap">
            <span class="input-icon"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>
            <input type="text" id="username" value="sv_k2301">
        </div>
    </div>
    <div class="form-group">
        <label>Mật khẩu</label>
        <div class="input-wrap">
            <span class="input-icon"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>
            <input type="password" id="password" value="123456">
        </div>
    </div>

    <div class="row-actions">
        <label class="remember"><input type="checkbox" checked> Ghi nhớ tôi</label>
        <a href="forgot-password.html">Quên mật khẩu?</a>
    </div>

    <button class="btn-login" onclick="xuLyDangNhap()">Đăng Nhập</button>

    <div class="demo-role-selector">
        <span class="demo-label">Chọn nhanh tài khoản theo vai trò:</span>
        <div class="demo-buttons">
            <button type="button" class="btn-role-tag" onclick="chonTaiKhoan('sv_k2301', '123456')">Sinh viên</button>
            <button type="button" class="btn-role-tag" onclick="chonTaiKhoan('gv_nguyenvana', '123456')">Giảng viên</button>
            <button type="button" class="btn-role-tag" onclick="chonTaiKhoan('admin', '123456')">Quản trị viên</button>
        </div>
    </div>

    <div class="footer-note">Bảo mật theo chuẩn doanh nghiệp</div>
</div>

<script>
    const USERS_DB = {
        "sv_k2301": {
            username: "sv_k2301",
            fullName: "Nguyễn Văn An",
            role: "student",
            roleName: "Sinh viên",
            permissions: ["diem_danh", "lich_su_diem_danh", "doi_mat_khau"]
        },
        "sinhvien": {
            username: "sv_k2301",
            fullName: "Nguyễn Văn An",
            role: "student",
            roleName: "Sinh viên",
            permissions: ["diem_danh", "lich_su_diem_danh", "doi_mat_khau"]
        },
        "gv_nguyenvana": {
            username: "gv_nguyenvana",
            fullName: "ThS. Nguyễn Văn Anh",
            role: "lecturer",
            roleName: "Giảng viên",
            permissions: ["quan_ly_diem_danh", "danh_sach_lop", "bao_cao_chuyen_can", "doi_mat_khau"]
        },
        "giangvien": {
            username: "gv_nguyenvana",
            fullName: "ThS. Nguyễn Văn Anh",
            role: "lecturer",
            roleName: "Giảng viên",
            permissions: ["quan_ly_diem_danh", "danh_sach_lop", "bao_cao_chuyen_can", "doi_mat_khau"]
        },
        "admin": {
            username: "admin",
            fullName: "Ngô Trung Hiếu",
            role: "admin",
            roleName: "Quản trị viên",
            permissions: ["quan_ly_nguoi_dung", "quan_ly_lop_hoc", "bao_cao_tong_hop", "cau_hinh_he_thong", "doi_mat_khau"]
        },
        "quantri": {
            username: "admin",
            fullName: "Ngô Trung Hiếu",
            role: "admin",
            roleName: "Quản trị viên",
            permissions: ["quan_ly_nguoi_dung", "quan_ly_lop_hoc", "bao_cao_tong_hop", "cau_hinh_he_thong", "doi_mat_khau"]
        }
    };

    window.onload = function() {
        const reason = localStorage.getItem("logout_reason");
        if (reason === "timeout") {
            document.getElementById("timeoutAlert").style.display = "block";
            localStorage.removeItem("logout_reason");
        }
    };

    function chonTaiKhoan(username, password) {
        document.getElementById("username").value = username;
        document.getElementById("password").value = password;
    }

    function xuLyDangNhap() {
        const usernameVal = document.getElementById("username").value.trim();
        const passwordVal = document.getElementById("password").value.trim();

        if (!usernameVal) {
            alert("Vui lòng nhập tài khoản!");
            return;
        }

        let user = USERS_DB[usernameVal.toLowerCase()];
        if (!user) {
            if (usernameVal.toLowerCase().startsWith("gv") || usernameVal.toLowerCase().includes("giangvien")) {
                user = {
                    username: usernameVal,
                    fullName: "Giảng viên " + usernameVal,
                    role: "lecturer",
                    roleName: "Giảng viên",
                    permissions: ["quan_ly_diem_danh", "danh_sach_lop", "bao_cao_chuyen_can", "doi_mat_khau"]
                };
            } else if (usernameVal.toLowerCase().startsWith("admin") || usernameVal.toLowerCase().includes("quantri")) {
                user = {
                    username: usernameVal,
                    fullName: "Quản trị viên " + usernameVal,
                    role: "admin",
                    roleName: "Quản trị viên",
                    permissions: ["quan_ly_nguoi_dung", "quan_ly_lop_hoc", "bao_cao_tong_hop", "cau_hinh_he_thong", "doi_mat_khau"]
                };
            } else {
                user = {
                    username: usernameVal,
                    fullName: "Sinh viên " + usernameVal,
                    role: "student",
                    roleName: "Sinh viên",
                    permissions: ["diem_danh", "lich_su_diem_danh", "doi_mat_khau"]
                };
            }
        }

        const expiresAt = Date.now() + 30 * 1000;
        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("sessionExpiresAt", String(expiresAt));
        localStorage.setItem("currentUser", JSON.stringify(user));
        window.location.href = "index.html";
    }
</script>

</body>
</html>

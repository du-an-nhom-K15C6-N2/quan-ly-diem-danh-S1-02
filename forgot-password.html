<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu - Hệ Thống Điểm Danh</title>
    <style>
        :root {
            --bg-start: #f0f7ff;
            --bg-end: #dfe9ff;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --card-bg: rgba(255, 255, 255, 0.87);
            --text: #0f172a;
            --muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            padding: 16px;
        }

        .card {
            background: var(--card-bg);
            padding: 32px 28px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 16px 36px rgba(15, 23, 42, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        h2 { color: var(--text); text-align: center; margin-bottom: 20px; font-size: 24px; }
        .hint { color: var(--muted); font-size: 13px; line-height: 1.5; margin: -8px 0 20px; text-align: center; }

        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; margin-bottom: 6px; color: var(--text); font-size: 13px; font-weight: 700; }
        .input-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid rgba(148, 163, 184, 0.35);
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        button:hover { transform: translateY(-1px); filter: brightness(1.03); }
        button:disabled { opacity: 0.65; cursor: wait; transform: none; }

        .message { margin-top: 15px; text-align: center; font-size: 14px; color: #047857; }

        .back-link { text-align: center; margin-top: 18px; }
        .back-link a { color: var(--primary); text-decoration: none; font-size: 13px; font-weight: 600; }
        .back-link a:hover { text-decoration: underline; }

        @media (max-width: 480px) {
            .card {
                padding: 24px 18px;
                border-radius: 16px;
            }
            h2 { font-size: 22px; }
        }

        @media (max-width: 360px) {
            body { padding: 12px; }
            .card { padding: 20px 14px; }
            h2 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Quên Mật Khẩu</h2>
        <p class="hint">Nhập email đã đăng ký. Liên kết đặt lại có hiệu lực trong 30 phút.</p>
        <form id="forgotForm">
            <div class="input-group">
                <label for="email">Nhập email đăng ký của bạn:</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <button type="submit">Gửi liên kết đặt lại</button>
        </form>
        <div id="message" class="message" role="status"></div>
        <div class="back-link">
            <a href="login.html">Quay lại đăng nhập</a>
        </div>
    </div>
</body>
<!-- Đặt đoạn script này trước thẻ đóng </body> trong forgot-password.html -->
    <script>
        const apiBaseUrl = window.location.protocol === 'file:'
            ? 'http://localhost:3000'
            : window.location.origin;

        document.getElementById('forgotForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const form = this;
            const email = document.getElementById('email').value.trim();
            const message = document.getElementById('message');
            const submitButton = form.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            message.textContent = 'Đang gửi liên kết...';
            message.style.color = '#047857';

            try {
                const response = await fetch(`${apiBaseUrl}/api/forgot-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });

                const result = await response.json();

                message.textContent = result.message;
                message.style.color = result.success ? '#047857' : '#b91c1c';
                if (result.success) form.reset();
            } catch (error) {
                console.error('Lỗi kết nối:', error);
                if (window.location.protocol === 'file:') {
                    message.textContent = 'Bạn đang mở file trực tiếp. Hãy chạy "npm start" rồi mở http://localhost:3000/forgot-password.html';
                } else {
                    message.textContent = 'Không thể kết nối đến máy chủ. Vui lòng kiểm tra lại server backend!';
                }
                message.style.color = '#b91c1c';
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</html>

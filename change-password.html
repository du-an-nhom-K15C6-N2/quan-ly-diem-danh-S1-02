<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi Mật Khẩu - Hệ Thống Điểm Danh</title>
    <style>
        :root {
            --bg-start: #f0f7ff;
            --bg-end: #dfe9ff;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-soft: #e0ecff;
            --card-bg: rgba(255, 255, 255, 0.92);
            --text: #0f172a;
            --muted: #64748b;
            --border: rgba(148, 163, 184, 0.35);
            --danger: #dc2626;
            --success: #16a34a;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            padding: 16px;
        }

        .card {
            background: var(--card-bg);
            padding: 32px 28px;
            border-radius: 20px;
            box-shadow: 0 16px 36px rgba(15, 23, 42, 0.12);
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .header {
            text-align: center;
            margin-bottom: 22px;
        }

        .header-icon {
            font-size: 36px;
            margin-bottom: 8px;
            display: block;
        }

        h2 {
            font-size: 24px;
            color: var(--text);
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--muted);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 700;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            background: white;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 6px;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
        }

        .btn-back {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: var(--primary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 0;
        }

        .btn-back:hover {
            text-decoration: underline;
        }

        .message {
            margin-top: 16px;
            text-align: center;
            font-size: 13px;
            padding: 10px;
            border-radius: 8px;
            display: none;
            line-height: 1.4;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: var(--danger);
            border: 1px solid #fca5a5;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: var(--success);
            border: 1px solid #86efac;
        }

        @media (max-width: 480px) {
            .card {
                padding: 24px 18px;
                border-radius: 16px;
            }

            h2 {
                font-size: 22px;
            }
        }

        @media (max-width: 360px) {
            .card {
                padding: 20px 14px;
            }

            h2 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <span class="header-icon"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg></span>
            <h2>Đổi Mật Khẩu</h2>
            <p class="subtitle">Đổi mật khẩu tài khoản đang đăng nhập</p>
        </div>

        <form id="changePasswordForm">
            <div class="form-group">
                <label for="currentPassword">Mật khẩu hiện tại:</label>
                <input type="password" id="currentPassword" required autocomplete="current-password" placeholder="Nhập mật khẩu hiện tại">
            </div>
            <div class="form-group">
                <label for="newPassword">Mật khẩu mới:</label>
                <input type="password" id="newPassword" required minlength="8" autocomplete="new-password" placeholder="Tối thiểu 8 ký tự, có chữ và số">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Xác nhận mật khẩu mới:</label>
                <input type="password" id="confirmPassword" required autocomplete="new-password" placeholder="Nhập lại mật khẩu mới">
            </div>
            <button type="submit" class="btn-submit">Xác nhận đổi mật khẩu</button>
        </form>

        <div id="message" class="message" aria-live="polite"></div>

        <a href="index.html" class="btn-back">← Quay lại trang chính</a>
    </div>

    <script>
        let systemCurrentPassword = "123456";

        document.getElementById('changePasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const currentPass = document.getElementById('currentPassword').value;
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;
            const messageDiv = document.getElementById('message');

            if (currentPass !== systemCurrentPassword) {
                messageDiv.textContent = "Mật khẩu hiện tại không chính xác!";
                messageDiv.className = "message error";
                return;
            }

            const regex = /^(?=.*\p{L})(?=.*\p{N}).{8,}$/u;
            if (!regex.test(newPass)) {
                messageDiv.textContent = "Mật khẩu mới phải có tối thiểu 8 ký tự, bao gồm cả chữ và số!";
                messageDiv.className = "message error";
                return;
            }

            if (newPass === currentPass) {
                messageDiv.textContent = "Mật khẩu mới phải khác mật khẩu hiện tại!";
                messageDiv.className = "message error";
                return;
            }

            if (newPass !== confirmPass) {
                messageDiv.textContent = "Mật khẩu xác nhận không khớp!";
                messageDiv.className = "message error";
                return;
            }

            systemCurrentPassword = newPass;
            document.getElementById('changePasswordForm').reset();
            messageDiv.textContent = "Đổi mật khẩu thành công!";
            messageDiv.className = "message success";
        });
    </script>
</body>
</html>
